<style>
:root{--bg:#0a0a0a;--surface:#1a1a1e;--surface-hover:#222228;--gold:#d4af37;--gold-dim:#a08028;--text-primary:#f5f5f0;--text-dim:#a0a0a0;--text-muted:#6b6b70;--border:#2a2a2e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:-0.01em}
a{color:var(--gold);text-decoration:none}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top-bar{flex:0 0 auto;background:linear-gradient(180deg,rgba(26,26,30,0.95)0%,rgba(26,26,30,0.85)100%);border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:10}
.top-inner{max-width:1400px;margin:0 auto}
.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.brand{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;color:var(--gold)}
.brand span{color:var(--text-primary);font-weight:500}
.mobile-toggle{display:none;background:rgba(212,175,55,0.1);border:1px solid var(--gold-dim);color:var(--gold);padding:.45rem .85rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.filter-group{display:flex;flex-wrap:wrap;gap:.4rem}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:.4rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:var(--gold-dim);color:var(--text-primary)}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#0a0a0a;box-shadow:0 0 14px rgba(212,175,55,0.18)}
.search-wrap{position:relative;flex:1 1 220px;min-width:180px;max-width:320px}
.search-wrap svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.search-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:.55rem .85rem .55rem 2.25rem;color:var(--text-primary);font-size:.9rem;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(212,175,55,0.18)}
.main{flex:1;display:flex;overflow:hidden;max-width:1400px;width:100%;margin:0 auto}
.sidebar{flex:0 0 320px;display:flex;flex-direction:column;background:rgba(26,26,30,0.55);border-right:1px solid var(--border)}
.sidebar-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.count{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.count strong{color:var(--gold);font-size:1.1rem;margin-right:.2rem}
.tip-list{flex:1;overflow-y:auto;padding:.5rem}
.tip-item{display:flex;align-items:flex-start;gap:.85rem;padding:.85rem .9rem;border-radius:10px;cursor:pointer;transition:background .18s;margin-bottom:.35rem;border:1px solid transparent}
.tip-item:hover{background:var(--surface-hover)}
.tip-item.active{background:rgba(212,175,55,0.12);border-color:var(--gold-dim);box-shadow:inset 4px 0 0 var(--gold)}
.day-badge{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,0.05);border:1px solid var(--border);font-size:.8rem;font-weight:700;color:var(--text-dim)}
.tip-item.active .day-badge{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.tip-meta{flex:1;min-width:0}
.tip-item-title{font-size:.95rem;font-weight:600;color:var(--text-primary);line-height:1.35;margin-bottom:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip-item.active .tip-item-title{color:var(--gold)}
.badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .5rem;border-radius:4px}
.content{flex:1;overflow-y:auto;padding:2rem 2.5rem}
.content-inner{max-width:760px;margin:0 auto;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text-muted);padding:2rem}
.empty-state svg{width:64px;height:64px;margin-bottom:1.25rem;color:var(--gold-dim);opacity:.7}
.empty-state h2{font-size:1.35rem;color:var(--text-primary);margin-bottom:.5rem}
.empty-state p{font-size:.95rem;max-width:320px}
.tip-header{margin-bottom:1.5rem}
.tip-cat-badge{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.35rem .75rem;border-radius:6px;margin-bottom:.75rem;display:inline-block}
.tip-date-line{font-size:.85rem;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.5rem}
.tip-title{font-size:2rem;line-height:1.2;color:var(--text-primary);margin-bottom:.5rem;font-family:"Playfair Display",Georgia,serif}
.tip-summary{color:var(--text-dim);font-size:1.05rem;line-height:1.85}
.tip-summary p{margin-bottom:1.25rem}
.tip-summary p:last-child{margin-bottom:0}
.gold-sep{display:block;text-align:center;color:var(--gold-dim);font-size:.9rem;letter-spacing:.5em;margin:1.75rem 0;user-select:none}
.today-banner{background:linear-gradient(135deg,rgba(212,175,55,0.2),rgba(212,175,55,0.08));border:1px solid var(--gold-dim);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);text-align:center;box-shadow:0 0 20px rgba(212,175,55,0.1)}
.today-tag{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:.15rem .4rem;border-radius:3px;background:var(--gold);color:#0a0a0a;margin-left:.35rem;vertical-align:middle;line-height:1.2}
.overlay{display:none}
@media(max-width:900px){
.mobile-toggle{display:inline-block}
.main{position:relative}
.sidebar{position:absolute;top:0;left:0;bottom:0;width:min(86vw,320px);z-index:20;transform:translateX(-105%);transition:transform .3s;box-shadow:4px 0 24px rgba(0,0,0,0.5)}
.sidebar.open{transform:translateX(0)}
.overlay{display:block;position:absolute;inset:0;background:rgba(0,0,0,0.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:15}
.overlay.open{opacity:1;pointer-events:auto}
.content{padding:1.5rem}
.tip-title{font-size:1.6rem}
}

<script>var TIPS = [{"day": 1, "category": "Preflop", "title": "Polarized C-Bet Framework", "summary": "On dry flops, polarize your c-betting range to strong made hands (top pair top kicker+) and strong draws (open-ended, flush draws). Check medium-strength hands — second pair, weak top pair — that want to control the pot. This structure prevents over-c-betting, keeps your checking range protected, and makes your betting range uncapped when you do fire.\n\nScenario: You open A♠K♠ from the cutoff, BB calls. Flop is K♥7♠2♦ — a dry, disconnected board. Your range contains monsters (AK, KQ, sets), medium hands (KJ, KT you might check), and air (AQ, AJ that missed). Polarize: bet your KQ+ and your draws like 98s that picked up backdoor equity. Check your KJ, KT to keep the pot manageable and stay uncapped on later streets.\n\nFrank Connection: Your JUNK% of 57% means you're c-betting too wide — throwing medium and weak hands into the betting range, which gets exploited by observant opponents who know your bet means top pair or nothing. Polarizing forces you to check more, exactly what the No desire philosophy demands: stop forcing action with marginal hands. Attack like a leopard — strike only when you have the claw in (value) or the claw is loading (draw), not every time a board flops.", "cat": "Preflop"}, {"day": 2, "category": "Postflop", "title": "Float Play Fundamentals", "summary": "Floating is calling a flop c-bet with the intention to take the pot away on the turn when checked to. It works best in position against habitual c-bettors who fire flop with a wide range but give up on turn cards that miss their range. You don't need a strong hand — you need a plan and some backdoor equity as insurance.\n\nScenario: You're on the button with 6♦7♦. CO opens, you call. Flop is A♠9♣3♥. CO bets 2/3 pot — a standard c-bet. You have nothing but backdoor straight equity, but you know CO c-bets 80% and gives up on 60% of turns. You call with the float plan. Turn is 5♣, CO checks. Now you bet 60% pot and CO folds 70% of the time. You win a pot you had no right to.\n\nFrank Connection: Floating is the opposite of playing JUNK hands — you enter the pot cheaply with a plan, not hope. Your junk showdown win rate of 8% means you're calling down hoping to improve, which is a losing strategy. Floating replaces hope with a concrete two-street plan: call flop with purpose, attack turn when weakness shows. This is quantum scan applied — you scanned the opponent's c-bet/give-up pattern before entering the pot.", "cat": "Postflop"}, {"day": 3, "category": "Math", "title": "Gap Concept Explained", "summary": "The Gap Concept states you need a stronger hand to call a raise than to make the initial raise yourself. The raiser has already declared strength — they were willing to put money in first. To call, you need a hand that beats their range, not just a hand you would open yourself. This gap is typically 5-10% of hands tighter.\n\nScenario: You would open A♠T♠ from middle position — it's a standard open. But when an UTG player raises 3x and it folds to you with A♠T♠, the Gap says fold. The UTG raiser's range is stronger than your opening range. Your ATs is ahead of loose opens but crushed by an UTG range of TT+, AQ+, KQs. You need AJs+ or 99+ to call here.\n\nFrank Connection: Your 57% JUNK% means you're ignoring the Gap entirely — calling raises with hands you wouldn't even open yourself. Every time you call a raise with J9s from the hijack because it is suited, you're violating the Gap and burning money. The No desire philosophy says: let the first gap hand go. Minglan teaches patience — wait for the right spot to strike, not every halfway-decent hand.", "cat": "Math"}, {"day": 4, "category": "Preflop", "title": "Squeeze Play Timing", "summary": "The squeeze play — re-raising after one or more callers — exploits capped ranges. When a player opens and gets one or two callers, the callers' ranges are capped (they didn't re-raise, so they don't have premium hands). The original raiser also becomes easier to fold if their bet-sizing was standard and they don't want to play a bloated pot multi-way.\n\nScenario: MP opens 3x, CO calls, you're on the button with A♠Q♦. You squeeze to 15bb (5x the original open). MP and CO both fold. You win 7.5bb without a flop. The squeeze works because CO's calling range caps them at hands like 66-JJ, AJ, KQ — hands that hate facing a big 3-bet out of position. Your AQ blocks AA, QQ, and AK, making it even harder for them to continue.\n\nFrank Connection: Your premium hand underuse means you're not squeezing enough with your strong hands, leaving money on the table. Your high JUNK% means you're often the CALLER getting squeezed — you're the one with the capped range. Attack like a leopard: when you see two capped ranges in front of you, that's the gazelle. Pounce with both value squeezes (AQ+) and calculated blocker squeezes in the right spots.", "cat": "Preflop"}, {"day": 5, "category": "Tournament", "title": "ICM and Bubble Play", "summary": "ICM (Independent Chip Model) converts tournament chips into real-money values. On the bubble, a chip lost is worth more than a chip gained because busting means $0 while surviving guarantees a cash. This means you need much stronger hands to call all-ins on the bubble than you would normally need. The penalty is severe — you might fold AK in some bubble spots.\n\nScenario: You're 7-handed at a final table with 6 paid. You have 20bb in the cutoff. UTG (25bb) shoves. You have AKs. In a cash game this is a snap-call. In this ICM spot, calling and losing drops you from approximately $2,000 equity to $0. Calling and winning gets you to approximately $2,800 equity. The risk is $2,000, the reward $800 — you need to win 71% of the time. AKs against UTG's shoving range is not 71%. Fold.\n\nFrank Connection: Your premium hand underuse gets worse in tournaments because ICM pressure magnifies every mistake. You need to tighten your calling ranges significantly on the bubble and at pay jumps. The No desire philosophy applies double here — the desire to gamble for the win is exactly what ICM penalizes. Let others bust themselves; you attack the pay jumps like a leopard waiting for the weak gazelle.", "cat": "Live Play"}, {"day": 6, "category": "Preflop", "title": "3-Betting Light", "summary": "3-betting light means re-raising with hands that aren't premium but have good blockers and playability. The goal is to win the pot preflop by making your opponent fold. Standard openers fold 60-70% to 3-bets, so you only need to be successful 1 in 3 times to break even. Good hands for light 3-bets include A2s-A5s (block AA/AK, have suited playability), K9s (block KK/AK), and low suited connectors.\n\nScenario: BTN opens 2.5x with a 45% opening range. You're in the BB with A♦4♦. You 3-bet to 9bb. BTN folds 65% of the time. Even when called, you have a suited ace with backdoor equity. The flop comes T♦7♠3♦ — you now have a flush draw and overcard. You can continue betting profitably.\n\nFrank Connection: You underuse premium hands — you are probably not even 3-betting your monsters enough. Adding light 3-bets forces opponents to respect your raises, making your premium 3-bets more effective. But don't overdo it — with 57% JUNK%, you already play too many hands. Light 3-betting is a scalpel, not a shovel. Attack like a leopard: 3-bet light 2-3 times per session in clear spots, then show down a real hand. Your image tightens instantly.", "cat": "Preflop"}, {"day": 7, "category": "Live Reads", "title": "Exploiting Calling Stations", "summary": "A calling station calls too much and folds too little. The textbook adjustment is simple: value bet thinly and never bluff. But real exploitation requires reading why they call. Some call because they are curious, some because they put you on a bluff, some because they chase. Each type requires a different approach: value-heavy betting against all, but sizing and timing vary.\n\nScenario: A loose-passive player calls your flop c-bet on K♠7♦3♣ with 86o. The turn is 2♠, they check again. Against a thinking player you'd check back for pot control. Against a calling station, bet again — 66% pot. They call with 86o again. River 9♥. They check a third time. Bet 75% pot. They call and show 86o — they made a pair of nines. You win with KQ. Standard TAGs fold the flop; stations pay you off.\n\nFrank Connection: You are the calling station with 57% JUNK% — you are the one opponents exploit. Your 8% junk showdown win rate proves you call too much and win too rarely. Flip it: when you notice a station at your table, adjust to pure value betting. But first, stop being the station yourself. Check every call through the Minglan lens: is this hand good enough to call? If not, fold — even if you are curious.", "cat": "Live Play"}, {"day": 8, "category": "Postflop", "title": "Overbetting Strategy", "summary": "An overbet is any bet larger than the pot. Use it when your range is polarized to nutted hands and air, and your opponent's range is capped (can't have the nuts). Overbets maximize value from your strong hands and maximize fold equity from your bluffs. They are most effective on rivers where the board changed dramatically in your favor and opponent's range is well-defined.\n\nScenario: You raise K♠K♥, BB calls. Flop K♣7♦2♠. You bet 33%, BB calls. Turn 8♠. You bet 66%, BB calls. River J♦ — board is K♣7♦2♠8♠J♦. BB checks. Your range has sets and two-pairs; his range has one-pair hands and missed draws. He can never have a straight or better set (you block KK). Overbet 150% pot — $300 into $200. He calls with KQ because he can't fold top pair. You extract maximum value.\n\nFrank Connection: Overbetting is the opposite of your usual leak. With 57% JUNK%, you are too aggressive with weak hands and too passive with strong ones. Overbetting forces you to be honest about hand strength — only the top of your range gets this treatment. Use it 2-3 times per session and watch opponents adjust. This is Attack like a leopard: when you have the claw, strike with full force.", "cat": "Postflop"}, {"day": 9, "category": "Math", "title": "Minimum Defense Frequency", "summary": "MDF = pot size / (pot size + bet size). It tells you the minimum percentage of your range you must continue with to stop your opponent from profitably bluffing any two cards. If villain bets $50 into $100 (1/2 pot), MDF = 100/150 = 67%. You must defend 67% of your range in that spot. But MDF is a theoretical floor — in practice, adjust based on opponent tendencies.\n\nScenario: On the river, villain bets $80 into $100 (80% pot). MDF = 100/180 = 55.6%. You must call with 55.6% of your river range. Your range at the river consists of 20 combinations: 12 value hands and 8 bluffs. MDF says continue with 11 of 20. You should call with all 12 value hands and fold all 8 bluffs — you are above MDF. But if you had only 8 value hands, you would need to call 3 bluff-catchers too.\n\nFrank Connection: Your 57% JUNK% means you are putting yourself in MDF-compromised spots constantly. You call preflop with J9o, miss the flop, face a bet — your MDF says defend 67% but your hand has 5% equity. You call anyway and lose. The solution isn't to call more on later streets — it is to stop putting JUNK in your range preflop so your MDF decisions are made with hands that have equity. No desire: fold pre, and MDF becomes easier.", "cat": "Math"}, {"day": 10, "category": "Postflop", "title": "Redline vs Blueline", "summary": "Redline = non-showdown winnings (bluffs, folds extracted). Blueline = showdown winnings. Most losing players have a positive blueline and negative redline — they win when they show down but lose too many pots without showdown. A winning player needs both: a healthy redline from well-timed aggression and a solid blueline from value extraction.\n\nScenario: In a 200-hand session, your blueline shows +$120 — you win at showdown. But your redline shows -$200 — you lose $200 in pots you never got to showdown. Net: -$80. This pattern means you are folding too much to aggression (passive redline) or calling too many streets then folding (leaking redline chips). Fix: c-bet more frequently in position, check-raise draws as semi-bluffs, and stop folding to every turn bet.\n\nFrank Connection: Your 8% junk showdown win rate suggests a specific redline problem: you take JUNK hands to showdown and lose, which tanks the blueline too. Your redline probably bleeds from calling flop with garbage, folding turn, then complaining you got bluffed. Quantum scan your own stats: if redline is deeply negative, you are either too passive or calling then folding too often. Attack the redline with planned aggression.", "cat": "Postflop"}, {"day": 11, "category": "Hand Reading", "title": "Range Merging", "summary": "Range merging means betting a continuous range of hands — not splitting into only value and bluffs, but including medium-strength hands in your betting range. This is useful on wet, dynamic boards where medium hands can get outdrawn if you check. On draw-heavy boards, merging protects your check-back range and prevents opponents from exploiting your betting range.\n\nScenario: You raise K♠Q♥, BB calls. Flop is K♦9♠7♠ — wet and connected. You have top pair with decent kicker but it is vulnerable to straight and flush draws. If you only bet KQ+, the BB knows any bet equals monster. If you only check medium hands, BB can blast the turn every time you check. Solution: merge your betting range — bet KQ, KJ, KT, and draws like T♠8♠. Check your monsters sometimes too. Balanced.\n\nFrank Connection: Your 57% JUNK% means you are merged in the wrong direction — you are betting too wide with garbage instead of medium-strength hands. Range merging is the opposite: it is about betting hands that have real equity, not hoping to steal. Minglan says: know what you hold. If you have KQ on K-hi dry board, that is a merged bet — a real hand, a real plan. Not a junk stab.", "cat": "Postflop"}, {"day": 12, "category": "Mental Game", "title": "Style Switching", "summary": "Style switching means changing your play style mid-session to exploit table dynamics. Tight tables reward aggression — open wider, 3-bet more. Loose tables reward patience — play tighter preflop, value bet postflop. Aggressive tables reward trapping — let them bluff into you. Good players detect the dominant style within 1-2 orbits and switch.\n\nScenario: You sit at a table where everyone is opening 35%+ and calling 3-bets. The table is too loose. Instead of joining the loose party, switch to a tight-aggressive style: play 18% of hands, 3-bet liberally with quality hands, and c-bet small. You don't need to out-loose the table — you need to let them donate to your tighter range. After 30 minutes, when they adjust, switch again.\n\nFrank Connection: Your 57% JUNK% means you are playing one speed — loose. You don't adjust to table dynamics. If the table is tight, you still play 57%. If it is loose, you play 57%. Style switching means deliberately choosing a different gear. At a loose table, use No desire — fold more, let them battle each other. At a tight table, Attack like a leopard — steal more. One range does not fit all.", "cat": "Psychology"}, {"day": 13, "category": "Mental Game", "title": "The Exit Protocol", "summary": "The Exit Protocol is a pre-determined rule for when you stop playing. Not when you are tired or when you have lost enough — those are feelings, not rules. A proper exit protocol specifies: (1) time limit (2 hours max), (2) stop-loss (2 buy-ins), (3) stop-win (3 buy-ins — lock up profit), and (4) a mandatory 15-minute break after a bad beat or suckout.\n\nScenario: You sit down with $500. Your protocol says: play 2 hours max, stop at -$200 or +$300, mandatory break after any hand where you lost a pot over $100 after being ahead. Three hours in, you are down $180 after a bad beat. But you are tired and tilted. Your protocol says stop — you are past 2 hours and close to stop-loss. You rack up and leave. The next day you would have punted the remaining $320 if you stayed.\n\nFrank Connection: You have no exit protocol — that is why JUNK% spikes at hour 3 when you are tired and chasing losses. The No desire philosophy means ending a session on your terms, not because you have busted. Attack like a leopard: a leopard doesn't hunt all night — it hunts in bursts, then rests. Your session should have the same structure. Set the protocol, write it down, follow it without exception.", "cat": "Psychology"}, {"day": 14, "category": "Bankroll", "title": "The Three-Bankroll System", "summary": "The Three-Bankroll System separates your poker funds into three accounts: (1) Main Bankroll — money you play with at current stake, (2) Upgrade Fund — 20% of profits that go toward moving up, and (3) Emergency Reserve — 3 months of buy-ins at current stake that you never touch except for emergency expenses. This structure prevents bankroll degradation from life expenses and creates a clear path to moving up.\n\nScenario: You start with $1,000 at NL50 (20 buy-ins). After 3 months you grind it to $1,600. Standard approach: withdraw $600 for expenses, play with $1,000 forever. Three-Bankroll approach: $1,200 stays as Main, $200 goes to Upgrade Fund, $200 to Emergency Reserve. When the Upgrade Fund hits $500 (10 buy-ins at NL100), you take a shot. If it fails, you drop down with your Main Bankroll still intact.\n\nFrank Connection: Your high JUNK% suggests you are playing scared money — 57% of hands because you are trying to get unstuck from a downswing. A proper bankroll system removes financial fear. When the Main Bankroll is fully separate, you make better decisions. Minglan says: don't gamble with what you can't afford to lose. Three accounts make that concrete. You never tilt-deposit because the Main is all you have.", "cat": "Sessions"}, {"day": 15, "category": "Math", "title": "Fold Equity Math", "summary": "Fold equity = (probability opponent folds) x (pot size before your bet). Every bluff has a break-even point: required fold percentage = bet size / (bet size + pot). When your opponent folds more often than this break-even, the bluff is profitable regardless of your hand's equity. The real power of fold equity comes from combining it with your hand's pot equity through semi-bluffing.\n\nScenario: Pot is $100. You bet $75. Required folds = 75/175 = 42.9%. If villain folds 50% of the time, your pure bluff shows immediate profit. But your hand has 25% equity when called (a flush draw). Your total expected value = 0.5 x $100 (fold) + 0.5 x (0.25 x $250 - 0.75 x $75) = $50 + 0.5 x ($62.50 - $56.25) = $50 + $3.13 = $53.13. Positive EV even when called.\n\nFrank Connection: You never calculate fold equity — you bluff based on feeling, which is why your JUNK% creates -EV situations. With 57% JUNK%, many of your bluffs are actually just bad hands with no equity when called. The math says a bluff only needs to work 43% of the time to be profitable — but your hand needs equity when called. Attack like a leopard: semibluff with draws and backdoors, never with pure air. The math supports the leopard.", "cat": "Math"}, {"day": 16, "category": "Tournament", "title": "Push-Fold Ranges", "summary": "Under 10 big blinds, your only moves are push or fold. Calling a raise is almost always a mistake because you commit to a pot with poor position and no maneuverability post-flop. The Nash equilibrium push-fold ranges tell you exactly which hands to shove from each position based on stack depth. From the button with 8bb, push 22+, A2+, K9+, Q9+, J9+, T9s+, 98s+.\n\nScenario: You have 8bb on the button. Folds to you. The blinds have 12bb and 15bb each. Your Nash pushing range: any pair, any ace, K9+, Q9+, J9+, T9+, suited connectors down to 98s. You look down at K5o — not in the Nash range. Fold. You look down at K9o — Nash says push. You shove 8bb, BB calls with ATo, you lose. It is still the correct push. Nash ranges are unexploitable.\n\nFrank Connection: Your 57% JUNK% becomes lethal short-stacked — you call raises with trash, then miss the flop and shove as a bluff. Learn the Nash push-fold ranges by position and stack depth. No desire means: when you are under 10bb, you don't want to play a hand — you execute the math. Minglan's wisdom: short-stack poker is pure math, not emotion. The leopard conserves energy; when it strikes, it is calculated.", "cat": "Live Play"}, {"day": 17, "category": "Postflop", "title": "Pot Control", "summary": "Pot control means keeping the pot small when you have a medium-strength hand that can't stand a big raise. The primary tool is checking — either checking back on the flop when in position, or checking-calling when out of position. Pot control is the opposite of building: you trade potential value for reduced risk against hands that could outdraw you or already have you beat.\n\nScenario: You open K♠Q♦ from the hijack, the big blind calls. Flop is K♥7♠2♣ — top pair, good kicker, dry board. A standard player bets 66% pot for value. But you know the BB is a calling station who will call any bet with any pair or draw. Instead of growing the pot and facing difficult turn decisions, you check back on the flop to control pot size. The turn is 4♦, BB bets 1/3 pot. You call. River 9♠, BB checks. You bet 1/2 pot for thin value, and he calls with K9. You win a moderate pot instead of getting stacked when the river is a 9.\n\nFrank Connection: With 57% JUNK%, you are constantly building pots with hands that can't handle heat. Pot control is the antidote — you deliberately keep pots small with medium holdings, which directly counters your tendency to overplay every hand. The No desire philosophy says you don't need to win every pot big. Minglan reminds us: sometimes the best strike is the one you don't take. Attack like a leopard by choosing your moments — not every top pair needs a pot-sized bet.", "cat": "Postflop"}, {"day": 18, "category": "Turn/River", "title": "The Turn Decision Tree", "summary": "The turn is poker's most important street — the pot has grown, one card remains, and your plan from the flop must hold or be abandoned. The turn decision tree has three branches: (1) continue betting if the turn improved your hand or range, (2) check if the turn is neutral and your hand is medium-strength, (3) fold if the turn completed opponent's draws and your hand can't improve. Most mistakes happen on branch 2 and 3.\n\nScenario: You raise A♠K♠, BTN calls. Flop K♦9♠3♣ — you c-bet 1/2 pot, BTN calls. Turn T♦ — the board is now K♦9♠3♣T♦. Your hand: top pair top kicker. The turn completes QT, J9s, T9s, KJ, and brings a flush draw. Decision tree: (1) Did the turn improve your range? Yes — your AK improved relative to BTN's calling range. (2) Is your hand strong? Yes, still TPTK. (3) Continue — bet 66% pot.\n\nFrank Connection: Your 57% JUNK% means you don't even reach the turn decision tree with most hands — you have already lost before the flop. But when you do have a real hand, you face the turn without a plan. Use the tree: is it continue, check, or fold? No desire means the fold branch is your friend. The leopard doesn't chase every deer — only the ones it knows it can catch.", "cat": "Postflop"}, {"day": 19, "category": "Mental Game", "title": "The Sunk Cost Trap", "summary": "The chips you have already put in the pot are gone. They should never influence your decision on whether to call, fold, or raise. Yet almost every player falls for sunk cost: I have already put in $50, I can't fold now for $30 more. The math doesn't care what you have invested — it only cares about the pot odds and your equity against the current villain's range. Every decision is fresh.\n\nScenario: You raise A♠Q♦ preflop to $15. One caller. Flop is J♠7♠2♣. You c-bet $20, villain calls. Turn 3♦. You bet $40, villain raises to $120. You have invested $75 of your $200 stack. You are getting 3:1 on a call of $80 more. Your hand: AQ high, no pair, no draw. Your equity against any raising range is under 5%. The $75 you already put in is irrelevant — you are throwing another $80 away. Fold.\n\nFrank Connection: The sunk cost trap is what keeps your JUNK% at 57%. You call preflop with J9s because you already posted the blind. You call the flop c-bet because you already put in $20. Each step is a new decision poisoned by the last one. No desire says: yesterday's chips are yesterday's problem. Each decision starts fresh. Quantum scan your own thinking: am I calling because of the current math, or because of chips I already lost?", "cat": "Psychology"}, {"day": 20, "category": "Turn/River", "title": "River Polarization", "summary": "On the river, your betting range should be polarized: only the best value hands (that can be called by worse) and the best bluffs (that fold out better). Medium-strength hands should be checking. Polarization is critical because the bet size is largest on the river — mistakes cost the most. A polarized range is either betting for value or bluffing, never in between.\n\nScenario: You open A♠K♠, CO calls. Flop K♣8♦2♠. You bet 1/3 pot, CO calls. Turn 4♠. You bet 2/3 pot, CO calls. River J♦. Board: K♣8♦2♠4♠J♦. You check to CO. CO bets 80% pot. Your AK is a bluff-catcher — you beat bluffs, lose to KJ, sets, straights. You should call if CO has many bluffs. But if CO is passive, fold. Your own river bet would be polarized: bet with KQ+ (value) or missed flush draws (bluff). Check with KJ, KT, 99.\n\nFrank Connection: You are not polarized — you bet medium hands like they are strong and check strong hands like they are weak. River polarization solves your premium hand underuse: when you have it, bet big. When you don't, bluff at the right frequency. Attack like a leopard: the river is where leopards show their teeth — either a full strike or a feint, never a half-hearted paw.", "cat": "Postflop"}, {"day": 21, "category": "Mental Game", "title": "The Action Bias", "summary": "Action bias is the psychological tendency to prefer doing something over doing nothing, even when doing nothing is optimal. In poker, this manifests as calling when you should fold, betting when you should check, or raising when you should call. The brain rewards action with dopamine — you feel like you are playing. But folding is often the highest-EV play, and it takes discipline.\n\nScenario: You have 9♠7♠ in the big blind. UTG opens 3x, three callers, you call (first mistake — action bias: I have suited cards, I can't fold). Flop is A♣K♥2♦. Everyone checks to you. You bet 1/2 pot (second action bias: I should bet). UTG calls. Turn 4♠. Check, you bet again (third action bias). UTG raises. You fold, having wasted $40 on a hand with zero equity on the flop.\n\nFrank Connection: Action bias IS your 57% JUNK%. Every hand you play because it is fun or because I have suited connectors is action bias. The fix: before every action, ask what changed? If the answer is nothing, fold. Minglan teaches non-action as power — the most dangerous position is the one you don't take. No desire means killing the urge to do something. Folding is winning.", "cat": "Psychology"}, {"day": 22, "category": "Mental Game", "title": "The Emotional Bankroll", "summary": "Your emotional bankroll is your mental capacity to handle variance without tilting. Like a financial bankroll, it has limits. Play too high relative to your emotional bankroll and you will make scared decisions. Play too long past your emotional limit and you will start punting. Signs of depleted emotional bankroll: anxiety about money, checking results mid-session, playing differently after a bad beat.\n\nScenario: You have taken three bad beats in 30 minutes: AA cracked by 78s, KK outdrawn by AQ, and a set of 9s lost to a runner-runner flush. Your emotional bankroll is at zero. You sit down at a new table, open A♠K♠, get 3-bet by a tight player, and stack off 100bb preflop because you are due. He has AA, you lose. That is emotional bankroll bankruptcy — you made a -EV play because your mental state was compromised.\n\nFrank Connection: Your high JUNK% is an emotional bankroll symptom — when you are frustrated, you play more hands. Track your emotional state alongside your results. When you feel the need to loosen up after a loss, that is emotional bankroll depletion. Apply the Exit Protocol: stop. No desire includes no desire to get even. Quantum scan your emotional state before deciding to play another orbit.", "cat": "Psychology"}, {"day": 23, "category": "Math", "title": "The Break-Even Equation", "summary": "Break-even percentage = bet / (bet + pot). This tells you how often your bluff needs to work to be profitable. A half-pot bet needs to succeed 33% of the time. A pot-sized bet needs 50%. Two-thirds pot needs 40%. Memorize these three numbers — they cover 90% of your betting situations. Every time you bluff without knowing your break-even percentage, you are gambling.\n\nScenario: Pot is $100. You consider bluffing $50 (half-pot). Break-even = 50/150 = 33.3%. If opponent folds more than 33%, the bluff is profitable regardless of your hand. If opponent calls 80%, the bluff is -EV. Quick check: would you bet $50 for a 33% chance to win $100? Yes. Now consider opponent's fold frequency — against a station who calls 80%, your fold equity is 20%, below break-even. Don't bluff.\n\nFrank Connection: Your junk showdown win rate of 8% means you are bluffing into calling ranges too often — you are not respecting the break-even equation. Before every bluff, multiply: do they fold enough? With 57% JUNK%, many of your bluffs are actually unprofitable calls after being raised. The Break-Even Equation is your pre-action checkpoint. Attack like a leopard: calculate the odds before striking, not after.", "cat": "Math"}, {"day": 24, "category": "Positional", "title": "Blind Defense Strategy", "summary": "Defending the big blind requires a wider range than the small blind because you close the action preflop and have better pot odds. But wider doesn't mean any two cards — you need hands that can realize equity postflop. Defend with suited hands, connected cards, and pairs. Fold unsuited, disconnected junk. Your defend range from BB against a 3x open should be about 35% of hands.\n\nScenario: CO opens 3x to $6 at 1/2. You are in the BB with $200. You have T♠7♠. Your defend range includes T7s because it is suited and connected — it flops draws and made hands. Pot odds: you need to call $4 to win $9, getting 2.25:1. You call. Flop is 9♠6♠2♦ — open-ended straight flush draw. You have massive equity. You can check-raise or lead. Now compare with T7o (offsuit) — same hand, no playability. Fold pre.\n\nFrank Connection: Blind defense is where 57% JUNK% starts — you defend the big blind with any two cards because it is cheap. It is not cheap — it is the start of every losing hand. Apply the Three-Fold Test: is it suited? Is it connected? Does it flop draws? If no to all three, fold. No desire: the big blind doesn't need defending with trash. Minglan's patience applies hardest from this seat.", "cat": "Preflop"}, {"day": 25, "category": "Hand Reading", "title": "Board Texture Reading", "summary": "Classify every flop as dry, wet, or dynamic. Dry flops (K♠7♦2♣) have few possible draws — ranges are static and position matters less. Wet flops (9♠8♠7♣) have many draws — ranges are fluid and you should bet more to charge draws. Dynamic flops (A♦J♠8♣) have some draws but favor the preflop aggressor. Your strategy on each should differ: small bets on dry, large bets on wet, mixed on dynamic.\n\nScenario: You raise A♠K♦, BB calls. Three flops, three strategies. (1) K♠7♦2♣ (dry): c-bet small, 25% pot. You have top pair, no draws possible — small bet extracts value. (2) 9♠8♠7♣ (wet): c-bet 75% pot. Charge straight/flush draws, protect your equity. (3) A♦J♠8♣ (dynamic): c-bet 50% pot. Good flop for you, some draws to charge, but not so wet that you need to overbet.\n\nFrank Connection: Your 57% JUNK% means you play every flop the same — which is terribly wrong. On dry flops, your junk has zero equity and should fold. On wet flops, your junk might have draws — you can semi-bluff. Board texture tells you which JUNK hands to keep and which to pitch. Quantum scan the flop before acting: dry, wet, or dynamic? Adjust immediately.", "cat": "Postflop"}, {"day": 26, "category": "Postflop", "title": "Delayed C-Betting", "summary": "A delayed c-bet means checking the flop as the preflop raiser, then betting the turn. The flop check caps your range — opponents know you don't have top pair or better. But that's exactly why the delayed c-bet works: opponents expect you to check-fold the turn, so they check back weak hands and bet strong ones. When you bet the turn, you represent a hand that improved or a bluff that picked up equity.\n\nScenario: UTG opens, you call on the button with 7♠8♠. Flop is A♦K♠3♠. UTG checks (typical after missing AKQ board). A standard c-bet would be foolish — you have nothing but a flush draw. You check back. Turn T♠ — you make your flush. UTG checks again, expecting you to take a free card. You bet 66% pot. UTG calls with AK, thinking you are bluffing the flush. You win big.\n\nFrank Connection: Delayed c-betting directly counters your premium hand underuse — you blast every flop with top pair, making opponents fold. By checking the flop with monsters too sometimes, you balance your range and get paid. For your draws, delayed c-betting is perfect: you let opponents think they are ahead, then strike when the draw completes. Attack like a leopard: the delayed strike is the deadliest.", "cat": "Postflop"}, {"day": 27, "category": "Tournament", "title": "Playing Short-Stacked", "summary": "Under 15 big blinds, your strategy simplifies dramatically. Preflop: push or fold only — no limping, no min-raises, no flat calls. Postflop: if you entered a pot, you are committed — plan to play for stacks. The key is knowing your Nash push-fold ranges by position and stack depth. At 12bb from the button, push 22+, A2+, K8+, Q9+, J9+, T9s, 98s. At 10bb from UTG, tighten to 55+, AT+, KQ.\n\nScenario: You have 12bb in the small blind. Folds to the cutoff who opens 2.2x. Big blind has 25bb. Your hand: A♦5♦. You have three options: fold, call, or shove. Calling is the worst — you give BB great odds to call, play a 3-way pot out of position with a marginal hand. Shoving is correct: you put max pressure on CO (who has to call off 10bb more with a capped range) and BB (who has 25bb and doesn't want to flip).\n\nFrank Connection: Under 15bb, 57% JUNK% is suicide — you can't play marginal hands. Every chip is precious. The Nash ranges are your No desire checklist: if it is not in the Nash chart, fold instantly, no thinking. Minglan says: in times of scarcity, every resource counts. Attack like a leopard: when short-stacked, pick the exact right moment. One well-timed shove doubles you up; five badly timed calls send you to the rail.", "cat": "Live Play"}, {"day": 28, "category": "Live Reads", "title": "Timing Tells", "summary": "Timing tells are subconscious signals from how quickly an opponent acts. Quick calls usually mean weak hands or draws — the player knows they are calling, they just do it. Quick checks mean they have already decided to check, often with a medium-strength hand they are unsure about. Slow calls often mean they are considering a raise — they have a genuine decision between calling and raising. Pattern recognition is key.\n\nScenario: On a flop of K♠Q♠7♣, an opponent insta-calls your c-bet. Their quick call suggests they already knew they would call — they have a middle pair, a draw, or top pair with a weak kicker. They didn't consider raising. Turn is a blank, they check quickly again. Your range is strong — barrel the turn. If they had snap-called flop, snap-checked turn, they have a capped medium-strength hand.\n\nFrank Connection: You are the one giving off timing tells — your 57% JUNK% means you have too many decisions per session, leading to rushed calls and nervous checks. Every chip you put in should be conscious, not reflexive. Quantum scan yourself: are you snap-calling because you want to play, or because you have decided? The Action Bias timing tell is what feeds your high JUNK%.", "cat": "Live Play"}, {"day": 29, "category": "Mental Game", "title": "Session Warm-Up Ritual", "summary": "A pre-session ritual primes your brain for optimal poker decisions. Top athletes don't walk into a game cold — they have a warm-up routine. Your poker ritual should include: (1) review your last session's biggest mistakes, (2) set a session goal (not a money goal — a process goal like three instances of pot control), (3) three deep breaths to enter flow state, (4) a single focus mantra: No desire. Attack like a leopard.\n\nScenario: Without a warm-up, you sit down, immediately open 7♠6♠ from UTG (57% JUNK% in action), get 3-bet, call, miss flop, fold. You were cold. With a warm-up, you review your notes: Fold JUNK from early position. First hand: A♠Q♦ from MP. Open 3x, BTN calls. Flop A♣8♦2♠. You bet small for value. Start the session sharp.\n\nFrank Connection: Your high JUNK% is worst in the first 15 minutes of a session when you are cold and excited. A warm-up ritual kills that cold-start aggression. Write your notes. Review your rules. The No desire mantra reminds you: you don't need to play every hand. The leopard doesn't run laps before hunting — but you are not a leopard, you are a human with cognitive biases that need warming up.", "cat": "Psychology"}, {"day": 30, "category": "Turn/River", "title": "Triple Barrel Spots", "summary": "Triple barreling (betting flop, turn, and river) requires a specific board and opponent profile. Best conditions: (1) the board runs out favoring your range (overcards to the board, flush/straight completes that hit your range), (2) your opponent has a capped range (they called preflop and flop, likely have one pair), (3) the river card is a scare card that is better for your range. Without all three, a third barrel is usually spew.\n\nScenario: You open A♠K♠, CO calls. Flop J♣7♠2♦. You c-bet 1/3 pot, CO calls. Turn Q♠ — you now have a gutshot and backdoor flush draw. You bet 2/3 pot representing KQ/QJ, CO calls. River A♣ — the perfect triple barrel card. The board runs J♣7♠2♦Q♠A♣. Your range has every set, two pair, and now top pair. CO's capped range can't have many aces. You overbet 125% pot. CO folds KQ. You won a pot with ace-high.\n\nFrank Connection: Triple barreling is the opposite of your JUNK% problem — it requires discipline and hand selection. You currently triple barrel with weak hands because you don't know when to stop. Triple barreling correctly means having a plan from the flop. Quantum scan the whole hand before starting. Attack like a leopard means sometimes it is a three-pounce hunt.", "cat": "Postflop"}, {"day": 31, "category": "Preflop", "title": "Opening Ranges by Position", "summary": "Your opening range should narrow significantly as you move from late to early position. UTG: 12-15% of hands (88+, AT+, KQ, A2s+, suited connectors 65s+). MP: 18-20%. Cutoff: 25-28%. Button: 35-40%. Small blind (when folded to): 40-45%. These numbers aren't arbitrary — they are based on how many players are left to act and how likely you are to be out of position postflop.\n\nScenario: UTG at a 9-handed table with A♠T♠. Standard UTG opening range: 88+, AT+, KQ, A2s+, 65s+. ATs is in your opening range — open to 2.2x. Now same hand on the button with folds to you. Your button range: 22+, A2+, K8+, Q9+, J9+, T9s, 98s, 87s, 76s, suited aces — about 35%. ATs is a snap-open on the button but a borderline open from UTG.\n\nFrank Connection: Your 57% JUNK% means you are opening UTG with hands like J9s, 86s, and other garbage. This is catastrophic — you are first to act, out of position against the whole table. Tighten UTG to 15%. If it is not in the top 15% of hands, it is not an UTG open. No desire at its finest: you don't need to play from UTG. The leopard waits for the right position before hunting.", "cat": "Preflop"}, {"day": 32, "category": "Math", "title": "Pot Odds Simplified", "summary": "Pot odds = call amount / (total pot after calling). If the pot is $50 and you must call $25, pot odds = 25/(50+25) = 25/75 = 33%. You need 33% equity to call profitably. The three key breakpoints to memorize: (1) 1/3 pot bet = 20% equity needed, (2) 1/2 pot bet = 25%, (3) 2/3 pot bet = 29%, (4) pot-sized bet = 33%. Compare your hand's equity against opponent's range to decide.\n\nScenario: Pot is $80. Villain bets $40 (half-pot). Your pot odds: 40/120 = 25%. You have a flush draw on the turn — 18% equity to hit on the river. 18% is less than 25%, so you can't call based on pot odds alone. BUT you have implied odds — if you hit, you can win an extra bet on the river. If villain will pay off a $60 bet on the river, your effective odds = 40/(120+60) = 40/180 = 22%. Still marginal.\n\nFrank Connection: Your 57% JUNK% means you are calling bets without calculating pot odds. You call $25 because you have two overcards without checking if 6 outs (24% equity) beats the required 25%. Every call should be a quick math check. Quantum scan: pot size, bet size, call needed, equity needed, my equity. If it is close and you have draws, call. No desire for guesses.", "cat": "Math"}, {"day": 33, "category": "Postflop", "title": "Check-Raise Strategy", "summary": "Check-raising is a powerful tool that should be used with a range, not just with monsters. A balanced check-raising range includes value hands (top pair+, sets) and drawing hands (open-ended straight draws, flush draws, combo draws). The check-raise builds the pot when you are strong and pressures opponents to fold marginal hands. Use it more on wet boards where opponents c-bet too frequently.\n\nScenario: You call a BTN open with 8♠7♠ from the big blind. Flop is 9♣6♠3♠ — you have an open-ended straight flush draw (15 outs!). BTN c-bets 2/3 pot. Check-raising is superior to leading: (1) you let BTN represent strength, (2) you build the pot with 54% equity against top pair, (3) you can win the pot immediately if BTN folds. You check-raise 3x their bet. BTN calls. Turn 2♠ — you make your flush and can now stack them.\n\nFrank Connection: You never check-raise — you either bet or call. Check-raising adds a third dimension to your game. With 57% JUNK%, you are calling too many flop bets. Check-raising forces you to choose a defense strategy with a plan. Attack like a leopard: sometimes you bare teeth from the bush. The check-raise is the leopard's ambush — appearing when the opponent least expects it.", "cat": "Postflop"}, {"day": 34, "category": "Hand Reading", "title": "Narrowing Ranges Street by Street", "summary": "Hand reading is a process of elimination. Start with the full possible range preflop, then narrow by every action: what hands would they play this way? The key is the would-they filter at each street. Preflop: would they open this? Flop: would they c-bet this? Turn: would they barrel this? River: would they value-bet or bluff this? Each filter removes hands from their range.\n\nScenario: Nit opens UTG (6% range: TT+, AJ+, KQ). Flop is J♠9♠3♣. They c-bet. Their range now: TT+ (but JJ/JJ/99 sets), AJ+, flush draws. Turn 5♦. They check. This removes AA, KK, AJ (they would continue betting). Their range is now: TT, QQ, flush draws, maybe AK with no spade. River 2♠. They check. Their range: TT, QQ maybe. You bet and they fold TT. You correctly read they had a middle pair.\n\nFrank Connection: You don't hand-read — you play your own cards. With 57% JUNK%, you are always surprised when opponents have it. Start narrowing: preflop to what did they raise? Flop to what did they bet? Turn to what is left? This is quantum scan applied to opponents. The more you narrow, the fewer junk calls you make. Minglan says: know your opponent better than they know themselves.", "cat": "Postflop"}, {"day": 35, "category": "Mental Game", "title": "The Recentering Breath", "summary": "After every major hand — big win, bad beat, or tough decision — take a 3-second breath before the next hand. This single habit prevents the emotional carryover that causes tilt. A bad beat makes you play loose (wanting action). A big win makes you play loose (feeling invincible). The recentering breath breaks the connection between the last hand outcome and the next hand decision.\n\nScenario: You get AA, get it all-in on a K♠7♠2♣ flop, and lose to 7♦2♦ that called a 3-bet. You are furious. Without the breath: you open J♠9♠ from UTG next hand, get 3-bet, call, miss, lose another $100. With the breath: you pause, exhale, tell yourself variance. Next hand is independent. You fold Q♣5♣ in the big blind to a raise. You saved $40. The breath saved more than your card skills could.\n\nFrank Connection: The recentering breath directly attacks your JUNK% spike after bad beats. Your 57% JUNK% isn't uniform — it spikes to 70% after a loss. The breath catches that spike before it costs you. No desire includes no desire for revenge. Quantum scan yourself between hands: am I centered? If not, breathe. Attack like a leopard with patience, not fury.", "cat": "Psychology"}, {"day": 36, "category": "Bankroll", "title": "Moving Down in Stakes", "summary": "Moving down in stakes is not failure — it is risk management. Every professional player moves down when their bankroll drops. The rule: move down when you lose 10 buy-ins at your current stake. Move back up when you have 25 buy-ins. The shame of moving down costs more in EV than the actual move-down. Staying at a stake you can't afford makes you play scared, which is the worst state for poker.\n\nScenario: You had $2,000 at NL100 (20 buy-ins). A downswing drops you to $1,100 (11 buy-ins). The rules say move down to NL50 ($1,100 = 22 buy-ins at NL50). You feel shame. But staying at NL100 with 11 buy-ins means: (1) You play scared, miss value bets, make tight folds. (2) One more bad session puts you on life support. (3) You tilt more because every dollar matters. Move down, rebuild.\n\nFrank Connection: Your JUNK% goes up when you are playing scared — and you are likely under-rolled for your stake right now. Moving down to where 57% of hands is affordable gives you room to fix leaks. No desire means: no desire to play above your bankroll. The leopard doesn't hunt elk when it is small — it hunts rabbits until it is big enough for the next prey.", "cat": "Sessions"}, {"day": 37, "category": "Positional", "title": "Stealing the Blinds", "summary": "Blind stealing from the cutoff and button should be a major profit center. When folded to you in late position, open with a wider range to exploit the blinds' inability to defend profitably. Standard steal ranges: BTN: 40-50% of hands, CO: 30-35%. Size your opens to 2.2-2.5x to give yourself good risk-reward. The blinds collectively fold about 60% of the time, making the steal immediately profitable.\n\nScenario: It folds to you on the button at a 1/2 table. SB is a tight player (18% VPIP), BB is loose (35% VPIP) but folds to c-bets 65%. You look at 9♠7♠ — not a premium hand, but a standard steal. You open to $5 (2.5x). SB folds. BB calls. Flop A♦8♠6♠ — you have an open-ended straight flush draw! You c-bet $6 (half-pot). BB folds 65% of the time. When he calls, you have massive equity. Win-win.\n\nFrank Connection: Your 57% JUNK% is often spent defending blinds from stealers — you are the mark, not the stealer. Flip it: be the stealer. When folded to you on the button, JUNK becomes a profitable steal. The difference is position: your JUNK is profitable on the button because you act last. Attack like a leopard: from the button, the blinds are gazelles. Hunt them.", "cat": "Preflop"}, {"day": 38, "category": "Tournament", "title": "Final Table Dynamics", "summary": "Final tables are a different game. ICM pressure rises exponentially as pay jumps approach. Short stacks tighten up (survival mode), big stacks bully (accumulation mode), and medium stacks get squeezed. The key adjustment: when the next pay jump is significant (e.g., final 9 to final 6), play tighter against short stacks and bullying chairs. Let others bust before you gamble.\n\nScenario: You are 8-handed at a final table, 6 paid. You have 25bb, 9th place pays $500, 6th pays $1,200, 1st pays $5,000. Short stack (8bb) shoves UTG. You have A♠J♠ in the cutoff. In a cash game, this is a snap-call. In this ICM spot: calling risks $700 bust equity for a chance at more chips. Actually, folding is correct — let another player bust the short stack. Your equity in the tournament is preserved by avoiding unnecessary flips.\n\nFrank Connection: Your premium hand underuse is magnified at final tables — you need to know when to fold AK. No desire means: let the short stacks bust themselves. Minglan says: the final table is won by the player who makes the fewest ICM mistakes, not the most aggressive plays. The leopard at the final table picks off the wounded and lets the healthy battle each other.", "cat": "Live Play"}, {"day": 39, "category": "Live Reads", "title": "Physical Tells at Live Tables", "summary": "Live poker gives you information that online never can: physical tells. Shaking hands when all-in means a monster (adrenaline from a big hand). Staring you down means weakness (trying to intimidate a fold). Quick movements to protect cards mean strength (they don't want you to see their hand is good). Nervous chatter usually means weakness. But beware — good players reverse these.\n\nScenario: You check-raise the river all-in. Your opponent goes into the tank. Their hand is shaking slightly as they count chips. Their breathing is shallow. Most amateurs read: nervous equals bluffing. Actually, the adrenaline from having the nuts causes physical shaking. They call with the nuts. The true tell: if they are trembling AFTER deciding to call (long tank plus shaking equals monster). If they snap-shove without a tremble, they might be bluffing.\n\nFrank Connection: You give off obvious tells at the table. Your 57% JUNK% means you are often unsure — and that shows in your body language. When you bluff, do you breathe differently? When you have a monster, do you stare harder? Quantum scan yourself: what am I broadcasting? The No desire philosophy extends to your body: no extra movements, no tells. The leopard is still before the leap.", "cat": "Live Play"}, {"day": 40, "category": "Mental Game", "title": "Variance Acceptance", "summary": "Variance means you can play perfectly and lose. You can play terribly and win. Over 10,000 hands, your results are about 90% skill, 10% luck. Over 100 hands, it is 90% luck, 10% skill. Accepting variance means: (1) you don't change your game after a bad beat, (2) you don't get overconfident after a lucky win, (3) you judge decisions, not results.\n\nScenario: You get KK, get 90% of your stack in preflop, and lose to AQ when an ace flops. This happens 1 in 3 times. Without variance acceptance: you stop 3-betting with KK because they always flop an ace. With variance acceptance: you know KK is 67% against AQ preflop and 3-bet all-in every time. You reload and do it again. The next 10 times you win 7 and lose 3. Your play is correct.\n\nFrank Connection: Your JUNK% likely spikes after bad beats because you lose faith in fundamentals. Variance acceptance keeps you on the path. No desire: no desire to change a winning strategy because of a single losing outcome. Quantum scan: was this a good decision that got unlucky, or a bad decision? The leopard doesn't change its hunting style because one gazelle escaped.", "cat": "Psychology"}, {"day": 41, "category": "Postflop", "title": "Probe Betting", "summary": "A probe bet is a bet made by the player who didn't raise preflop, into the preflop raiser, on the flop or turn after the raiser checks. It is a powerful weapon that regains the initiative. Probe when: (1) the preflop raiser checks, indicating weakness, (2) the flop/turn card is good for YOUR range, not theirs, and (3) you have some equity (a pair, a draw, or just two overcards).\n\nScenario: You call a CO raise from the big blind with K♦7♦. Flop is J♠8♦2♣. CO checks. This is unusual — they c-bet 70% of flops. Their check says: I have AJ, AT, 99, or missed. You bet 1/2 pot as a probe. If CO folds (likely when they have missed), you win. If they call, you know they have something. Turn 7♠ — you improve to second pair. Now you can check-call or bet again for value against AJ.\n\nFrank Connection: Your 57% JUNK% means you are calling preflop, then checking and folding when you miss. Probe betting gives your JUNK hands a second life when villain shows weakness. But use it selectively — 2-3 times per session, not every time. Attack like a leopard: when the preflop raiser hesitates, that is your opening. Strike with a probe bet.", "cat": "Postflop"}, {"day": 42, "category": "Turn/River", "title": "River Thin Value", "summary": "Thin value means betting the river with a hand that is only slightly better than your opponent's calling range. The decision criteria: (1) does villain have enough hands worse than mine that will call? (2) will villain raise with worse? (almost never), (3) what is the worst hand I would value bet here? The answer to (3) is your thin-value boundary. Most players miss 30-40% of thin value by checking when they should bet.\n\nScenario: You open K♠Q♦ from MP, BTN calls. Flop K♥7♠2♣. You c-bet 1/3 pot, BTN calls. Turn 5♦. You bet 2/3 pot, BTN calls. River 3♠. Board: K♥7♠2♣5♦3♠. You have top pair, second kicker. Your hand is thin value — you beat 66, 88, 99, A7, J7, 87, 76, T9s, 98s. You lose to K9+, sets, two-pair. Does villain call with 66? Yes, over 50% of the time. Bet 1/2 pot for thin value.\n\nFrank Connection: Your premium hand underuse means you are checking when you should be value-betting. River thin value is where you leave the most money on the table. With 57% JUNK%, you have fewer value opportunities — so when you finally have a hand, extract maximum value. Attack like a leopard: if you have KQ on a K-hi board, the gazelle is 66 calling your river bet. Take it.", "cat": "Postflop"}, {"day": 43, "category": "Hand Reading", "title": "Blockers and Unblocking", "summary": "Blockers are cards you hold that make it less likely your opponent has certain hands. Holding the A♠ blocks 25% of all flush combos on a 4-flush board. Holding KK blocks half of AA combos (AA has 6 combos, holding KK leaves 3). Use blockers to: (1) bluff more when you block the nuts, (2) value bet thinner when you block top pairs, (3) call more when you block value hands.\n\nScenario: River is A♠K♠Q♠J♠T♦ — a broadway board. You have the A♠ in your hand. Opponent bets 2/3 pot. The nut flush is impossible because you hold the A♠. The second nut flush is the K♠ — there are only 4 remaining spades, and only K♠ beats you. Your blocker means opponent's range is mostly bluffs and weaker flushes. Call. Now imagine you have Q♠ instead. Opposite — you block second-nut flushes but don't block the A♠. Opponent could have the nuts. Call less.\n\nFrank Connection: Your 57% JUNK% means you never think about blockers — you call or fold based on your hand strength alone. Learning blockers improves your junk decisions: when you have the ace of a suit, bluff more because you block the nuts. When you have a low suited card that blocks nothing, fold more. Quantum scan your blockers before deciding. No desire: don't bluff when you don't have blockers.", "cat": "Postflop"}, {"day": 44, "category": "Math", "title": "Implied Odds Calculation", "summary": "Implied odds adjust pot odds by adding the additional chips you expect to win if you hit your draw. The formula: effective odds = (call amount) / (current pot + call amount + expected future win). If you need to call $10 to win a $30 pot and you will win $30 more on the river when you hit, your real odds are 10/(30+10+30) = 10/70 = 14.3%. Your draw needs a 14.3% chance, not the raw 25% pot odds suggest.\n\nScenario: Pot is $40. Villain bets $15 on the turn. You have a gutshot straight draw (4 outs, 8.5% to hit on river). Raw pot odds: 15/(40+15+15) = 15/70 = 21.4%. Your gutshot is 8.5% — not enough. BUT if villain will pay off a $50 bet on the river when you hit: effective odds = 15/(40+15+15+50) = 15/120 = 12.5%. Your 8.5% still isn't enough. You need villain to pay off $100+ when you hit. Against a thinking player, fold.\n\nFrank Connection: You call too many draws based on implied odds that don't actually exist. Your 57% JUNK% includes too many suited connectors chasing gutshots. Calculate: how much can you really win when you hit? Against thinking players who fold to obvious completes, implied odds are near zero. No desire: don't chase gutshots against players who can fold. Minglan: the future chips aren't yours until you earn them.", "cat": "Math"}, {"day": 45, "category": "Preflop", "title": "Limped Pots and Isolation", "summary": "When multiple players limp, you have a golden opportunity to isolate. Raise 4x plus 1x per limper to build a heads-up pot in position. The limpers have capped ranges (they didn't raise), so you can value raise with hands as weak as AJo and KQ. The isolation raise turns a multi-way pot into a heads-up pot against the weakest range at the table. This is one of the highest-ROI plays in poker.\n\nScenario: Four players limp in front of you on the button at 1/2. Pot is $10 (4 limpers + SB + BB). You have A♠T♠. Raise to $18 (4x + 4 per limper). The limpers fold because their range is capped at AJ or worse, and they don't want to call a big raise with 77 out of position. You win $10 risk-free. Occasionally BB calls with a pair or suited connector — you c-bet $12 on any flop and win 70%.\n\nFrank Connection: Isolation directly counters your high JUNK% — instead of limping in with 57% of hands, you selectively raise with a strong range against capped opponents. This is Attack like a leopard: you see a herd of gazelles (capped limpers), you pick the one you can take (the weakest range), and you strike. No desire: no desire to limp in and see a cheap flop with junk. Raise and win.", "cat": "Preflop"}, {"day": 46, "category": "Postflop", "title": "Multi-Way Pot Strategy", "summary": "In multi-way pots (3+ players to the flop), the dynamics shift dramatically: (1) bluff less — fold equity drops because someone always has something, (2) value bet more thinly — players call with worse hands multi-way, (3) draw more aggressively — you get better odds to chase, (4) tight preflop — avoid marginal hands that play poorly multi-way. The core rule: multi-way pots reward the best hand, not the best bluffer.\n\nScenario: You open A♠K♦ from MP, BTN calls, BB calls. Three-way to the flop: K♠8♠2♦. You have top pair top kicker on a draw-heavy board. BB checks. In heads-up, you might check-raise or bet small. Multi-way, pot is $30 and there are two opponents with uncapped ranges. Bet bigger — $24 (80% pot). You charge flush draws (BTN) and protect against BB's random two-pair. BTN calls with 7♠6♠. Turn Q♠ — BTN now has a flush. Check-fold.\n\nFrank Connection: Your 57% JUNK% is suicidal in multi-way pots. You call raises with J9s, four people see a flop, and you try to bluff into three opponents. Multi-way, you have no fold equity. Tighten your calling ranges multi-way to top 15% of hands. No desire: no need to play 57% in a multi-way pot. Attack like a leopard: in a crowd, the leopard waits for the single target, not the herd.", "cat": "Postflop"}, {"day": 47, "category": "Mental Game", "title": "Post-Session Review Protocol", "summary": "Review every session within 2 hours — the details fade fast. The protocol: (1) note 3 biggest mistakes, (2) identify the leak pattern (JUNK% too high? Missed value? Too passive?), (3) write one adjustment for next session, (4) record the result without emotion: buy-in, cash-out, hands played, big pots. A 5-minute review compounds into massive improvement over 100 sessions.\n\nScenario: Session result: -$150 over 400 hands. Without review: bad session, run bad, try again tomorrow. With review: you look at your tracker. JUNK% was 62% — above baseline. Hand 34: called a 3-bet with J9s from the hijack. Hand 87: floated OOP with 86o. Hand 203: bluffed into three opponents on a wet board. Three clear JUNK calls. Adjustment: tomorrow, fold to 3-bets with anything below AJ+ or 99+, and never float OOP. Next session: JUNK% 52%, result +$80.\n\nFrank Connection: This protocol is the cure for your 57% JUNK%. Without review, you repeat the same mistakes. With review, you see the pattern: JUNK calls, junk floats, junk bluffs. Each session you shrink the JUNK%. Quantum scan your session data, not just your results. No desire: no desire to skip the review because the result was bad. The leopard learns from every failed hunt.", "cat": "Psychology"}, {"day": 48, "category": "Preflop", "title": "Defending the Small Blind", "summary": "The small blind is poker's worst seat. You have the worst position postflop, you are first to act, and you have already committed 0.5bb. Defend sparingly — about 15-20% of hands against a button open (versus 35-40% from the big blind). Your defense range should be: pairs (22+), suited aces (A2s+), broadways (AT+, KJ+, QJ+), and premium suited connectors (J9s+, T9s, 98s). Fold everything else — especially unsuited junk.\n\nScenario: BTN opens 2.5x at 1/2. You are in the SB with A♦4♦. Your SB defend range says defend — it is a suited ace with flush potential. You call. Flop A♣7♠2♦. You check-call BTN's c-bet (check-raising makes no sense — you are out of position). Turn 4♣ — two pair! You check-raise BTN's turn bet to 3x. They fold. This hand wins money because you defended from SB with a playable hand. Now compare with A♦4♣ (offsuit) — not in defend range, fold pre, save $4.\n\nFrank Connection: Your 57% JUNK% from the small blind is catastrophic — the worst position, worst equity, worst postflop playability. Defend tight. If it is not in the top 15% of hands, fold from SB. No desire means: no desire to protect your small blind with junk. The leopard doesn't fight from a bad position. Minglan says: sometimes the best defense is retreat. Fold SB preflop and save chips for real opportunities.", "cat": "Preflop"}, {"day": 49, "category": "Live Reads", "title": "The First-Orbit Player Profile", "summary": "The first orbit around a table is the most valuable data-gathering phase in poker. Instead of playing your normal range, spend the first 5-6 hands in pure observation mode, profiling each opponent on exactly three axes: (1) Do they open-raise or limp? — limping from LP indicates low greed (they want to see cheap flops but fold to aggression), while raising indicates normal-to-high greed. (2) Do they fold to 3-bets or call? — folding quickly = high fear, calling wide = low fear. (3) When they c-bet, do they follow through on the turn? — checking turn = capped range, betting again = uncapped or committed. In one orbit, you've quantized every player into one of four quantum states: high-fear/high-greed (tight-aggressive who overfolds), high-fear/low-greed (calling station who gives up postflop), low-fear/high-greed (maniac who barrels everything), low-fear/low-greed (nit who's almost invisible).\n\nScenario: You sit down at a 6-max NLH table with 100BB. First hand folds to the button who opens 3x with A9o — you fold. Second hand: UTG limps, MP limps, you're in the BB with 84o — you check, flop checks through, turn everyone folds. Third hand: CO opens 2.5x, button calls, you fold. Fourth hand: MP opens 3x, you're on the button with KJo — you fold. Fifth hand: SB completes, you check from BB with 63o. After orbit: UTG limped twice and folded to any raise (high fear, low greed = easy to steal from). MP raised once, called a 3-bet once (moderate fear, moderate greed = play solid ranges against). CO raised twice, c-bet both times, double-barreled once (low fear, high greed = let him barrel into you with strong hands, then trap). Button folded to every raise (extreme fear = steal his blinds every orbit). You now have more useful information than if you'd played 10 hands and hit one pair.\n\nFrank Connection: This takes your quantum scan framework from a meditation exercise to a concrete data-collection protocol. Instead of wondering about 'fear/greed superposition,' you're actively observing three specific, measurable behaviors per player. The No desire principle is built in — you're spending the first orbit in pure observation mode, not desiring to play hands. Minglan would approve: you're patiently watching from the shadows, building a complete map of the battlefield before making a single move. Most critically, this first-orbit discipline directly attacks your JUNK% problem: if you're actively profiling during the first 6 hands, you simply don't have mental bandwidth to consider playing 86o from MP. You're observing, not desiring. After the orbit, you know exactly who to attack (the high-fear players who overfold) and who to avoid (the low-fear players who won't fold marginal hands — the exact type who punish your junk holdings). This is the leopard: watch first, strike later, strike precisely.", "cat": "Live Play"}, {"day": 50, "date": "Jul 17", "category": "Tournament", "title": "The 30-Big-Blind Rule — Calling Is a Tournament Death Sentence", "summary": "Frank, here's a rule that, if you internalize it, will cut your JUNK% in half in tournament play: below 30 big blinds, never cold-call a raise. Ever. Your play should be 100% raise-or-fold — call is the third option that doesn't exist.\n\nWhen you call with 30BB or less, you create an SPR (Stack-to-Pot Ratio) of around 6-7 on the flop. That means one pot-sized bet and you're committed. You've made the pot so large relative to your stack that you can't fold to a c-bet — but you also don't have enough chips to apply real pressure with a check-raise or bluff. You're stuck in the dead zone: too much invested to fold, too little behind to leverage. This is exactly where your 8% junk showdown win rate lives — you call with trash, the flop misses (because it always misses junk), and you're priced in to call the c-bet because you already invested those chips.\n\nThe fix is mathematically simple: below 30BB, your preflop decision tree has exactly two branches. If you're considering entering the pot and the hand is worth playing, raise to 2-2.5BB — you define the price, you win the dead money when they fold, and you control the story. If the hand isn't worth raising, fold it. Calling is always, mathematically, the worst option. Think about it: when you limp-call a 2BB raise with J8o from MP with 25BB, you invest 8% of your stack to see a flop that will miss you 68% of the time. After the c-bet, you've lost 14-16% of your stack on a single orbit. Do that three times in a tournament and you're under 15BB with no fold equity — a dead stack.\n\nThis connects directly to your JUNK% problem. Look at your own data: 986 hands playing junk from EP vs passive tables, and the matrix says Fold but you're calling. That's the 30BB trap in action. The moment you cross below 30BB, the preflop recite should change: instead of 'is this hand playable?' it becomes 'is this hand worth 10% of my stack?' Because when you call from EP with 25BB, that's effectively what you're doing — committing 8% of your survival chips to see a flop that will miss you. As Minglan would say: survival first, action second. No desire for the pot you haven't won yet. At 30BB and below, raise to build the pot you want — or fold to save the chips you need.", "cat": "Live Play"}, {"day": 51, "date": "Jul 18", "category": "Turn/River", "title": "The \"Equity Shift\" Turn — When the Board Flips the Script", "summary": "Every turn card tells a story — but most players only read the first sentence. The \"equity shift\" turn is a specific card that flips which player has the range advantage. It's the Q on a J-T-4-2 board, the flush completing when one player held all the suited combos, the board pairing when the preflop aggressor holds all the overpairs. These cards create mandatory aggression spots or mandatory check-folds depending on whose range they hit. On every turn, ask yourself: \"Does this card help my range more or my opponent's?\" If the answer is yours and you're not betting, you're leaving money on the table. If the answer is theirs and you're still firing, you're burning chips.\n\nYou defend your big blind with 9♠8♠ against a CO open. Flop comes J♣T♦4♥, rainbow. CO c-bets 33% and you call with your gutshot and two overcards. The turn is the Q♠ — an EQUITY SHIFT. Before the Q: CO's range had all the top pairs, overpairs, and combos like KJ and QT. Your range was capped at one pair with a draw. After the Q: You now have the nuts (98 for the straight), plus all your T9, J9, and 97 combos also improved. CO, meanwhile, can have KQ and QTs for straights — but also all those Jx and Tx hands now drawing dead. Your range has MORE equity now. You must donk-lead or check-raise here. Check-call is the worst — you let him realize his equity for free and miss value from hands that would call a donk bet.\n\nThis concept attacks your biggest leak from a new angle. At 57% JUNK%, you're not playing enough 98s, T9s, 87s — the very hands that dominate equity-shift turns. But when you DO get premiums (2% of hands with TT+ at 65% win rate), you might still lose value because you're not recognizing when a turn card shifted equity in your FAVOR. Your data shows blinds + junk + 3-weak → check is profitable (+9,925 avg), but when you actually hit the equity-shift turn, you need to attack like a leopard: suddenly, unexpectedly, with conviction. This is Second Odds (math) telling you the river is now yours to steal. And when the turn shifts AGAINST you — like a flush completing when you have JJ on a board that favors the preflop caller's range — clean up fear with Minglan: you have no desire to put more chips in a pot where the math just turned against you. Check-fold, no regret.", "cat": "Postflop"}];

var TD = 51;
var activeFilter="ALL",activeId=TD;

function n(s){return(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function getTips(){var q=n(sI.value);return TIPS.filter(function(t){return(activeFilter==="ALL"||t.cat.toUpperCase()===activeFilter)&&(!q||n(t.title).indexOf(q)!==-1||n(t.summary).indexOf(q)!==-1)})}
function fmt(t){return t.split("\\n\\n").map(function(p){return"<p>"+p.replace(/\\n/g,"<br/>")+"</p>"}).join("")}
function badge(cat,cls){var m=CM[cat]||CM.Preflop;return'<span class="'+cls+'" style="color:'+m[0]+";background:"+m[1]+";border:1px solid "+m[0]+'30;">'+cat+"</span>"}
function rList(){var tips=getTips();tC.textContent=tips.length;tL.innerHTML=tips.map(function(t){return'<div class="tip-item'+(activeId===t.day?" active":"")+'" data-day="'+t.day+'"><div class="day-badge">'+(t.day===TD?"★":t.day)+'</div><div class="tip-meta"><div class="tip-item-title">'+t.title.replace(/"/g,"&quot;")+'</div>'+badge(t.cat,"badge")+(t.day===TD?' <span class="today-tag">TODAY</span>':"")+'</div></div>'}).join("");if(activeId!==null){var el=tL.querySelector('[data-day="'+activeId+'"]');if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})}}
function rContent(t){if(!t)return;var m=CM[t.cat]||CM.Preflop;var banner=t.day===TD?'<div class="today-banner">&#9733; TODAY'S TIP</div>':"";cI.innerHTML=banner+'<article class="tip-header"><span class="tip-cat-badge" style="color:'+m[0]+";background:"+m[1]+";border:1px solid "+m[0]+'30;">'+t.cat+'</span><div class="tip-date-line">'+t.date+'</div><h2 class="tip-title">'+t.title+'</h2></article><div class="gold-sep">&#9670; &#9670; &#9670;</div><div class="tip-summary">'+fmt(t.summary)+"</div>";eS.style.display="none";cI.style.display="block";cI.style.animation="none";void cI.offsetHeight;cI.style.animation=""}
function selectTip(d){if(activeId===d){activeId=null;eS.style.display="flex";cI.style.display="none";rList();return}activeId=d;rContent(TIPS.find(function(t){return t.day===d}));rList();if(window.innerWidth<=900)closeS()}
