call only teaches you that you were right to hope for a miracle \u2014 which reinforces the junk-calling habit. The fold teaches you something new about the table every single time.\n\nFrank Connection: Your 57% JUNK% is the single clearest symptom of desire running your preflop decisions. Every junk call from EP or MP starts with the thought \"I want to win this pot\" \u2014 never \"what will I learn by folding?\" The Curiosity Frame directly attacks this. When you catch yourself looking at 9\u26603\u2660 in MP and thinking \"it's suited, let's see,\" stop and reframe: \"What will I learn by folding? I'll learn how the table reacts to limpers, who squeezes, who overfolds to c-bets \u2014 actual data that makes me a better player on the NEXT hand.\" JUNK% drops not through willpower but through replacing the desire to gamble with the curiosity to observe. This is the quantum scan made real: neutral, detached observation of the table state, free from the noise of personal involvement. Minglan survives by watching, not by fighting. When you're curious, you fold junk without effort. When you're desiring, you call junk and then wonder why your win rate is stuck at 18%.", "cat": "Psychology"}, {"day": 53, "date": "Jul 20", "category": "Turn/River", "title": "The River Check-Back \u2014 When the Free Showdown Is Your Best Value Play", "summary": "The River Check-Back is the discipline to take the free showdown when your hand is medium-strength and your opponent has shown no aggression. Many players instinctively bet the river when checked to, even with hands that only beat bluffs. The check-back recognizes that your real value comes from reaching showdown, not from extracting thin value that gets check-raised off your hand.\n\nScenario: You open K\u2660Q\u2660 from MP, BB calls. Flop K\u26657\u26632\u2663 \u2014 you c-bet, BB calls. Turn 4\u2660 \u2014 BB checks, you bet, BB calls. River 9\u2665, BB checks. Your desire says \"value bet\u2014he's been calling.\" But what range calls two streets and checks the river? Missed draws fold to a bet (zero value). Worse Kx might call, but few combos survive preflop defense. Better hands (KJ, K10, 97, sets) check-raise and you lose showdown value you already had. The only profitable outcome is if villain calls with exactly the worst Kx \u2014 everything else either folds (no gain) or check-raises (you lose). Against Frank's most common 3 Weak opponents who rarely check-raise bluff the river, the check-back is pure profit: you win against all missed draws and pairs worse than yours, and never get blown off the best hand.\n\nFrank Connection: This directly attacks two leaks. (1) Overplaying medium-strength hands \u2014 your matrix data shows you under-raise medium hands from EP/MP/Blinds vs 3 Weak preflop (too passive early), then over-bet them postflop when they become top pair. The river check-back restores balance. (2) The 8% junk showdown win rate \u2014 when your junk actually reaches the river, ALWAYS check it back. Betting junk on the river turns a free information peek into a guaranteed loss when villain calls with better. This is No desire in action: you don't need every last chip from the pot. You take the piece the river has given you\u2014the showdown\u2014without risking it on a thin value bet. Minglan wouldn't bet KQ into three checks\u2014she'd silently collect her pot, note villain's range, and wait for the next hand. Attack like a leopard means conserving energy for when you have the monster, not splashing chips with top pair second kicker.", "cat": "Postflop"}, {"day": 54, "date": "Jul 21", "category": "Postflop", "title": "The Turn Barrel \u2014 When to Double-Barrel and When to Give Up", "summary": "The Turn Barrel Framework gives you three categories after your flop c-bet gets called. Barrel Cards (cards that improve your range or scare the opponent, like an Ace on J-7-2) \u2014 fire 75% pot. Check-Fold Cards (total bricks like the 2d on J72) \u2014 give up, save your stack. Bluff-Catch Cards (draws that complete) \u2014 usually give up, because opponents who called a flop c-bet on a drawy board often made their draw.\n\nConcrete scenario: You're in LP with 9s8s on Kc7d2s. You c-bet 33% \u2014 standard. Villain calls. Turn is 3h \u2014 total brick. Check-fold. Villain has KQ/KJ/KT or 88-TT and isn't folding to a second bet. But if turn is Ah \u2014 now you barrel 75% pot. Villain's KQ is suddenly very uncomfortable. Your 9-high has zero showdown, but your story is perfect: \"I had AK the whole time.\"\n\nConnection to your leaks: Your EP+Junk+3Weak data shows 328 hands continuing postflop \u2014 net +1,498 but matrix says Fold. The +4.6 avg is variance hiding a structural leak. The Turn Brick rule gives you a hard stop: if you c-bet junk and the turn is a brick, it's your \"no desire\" trigger. Minglan says observe, don't act. Attack like a leopard means planning two coordinated shots, not blindly firing. Quantum scan: who called? Loose passive = check-fold always. TAG maybe floating = barrel the right cards.", "cat": "Postflop"}, {"day": 55, "date": "Jul 22", "category": "Hand Reading", "title": "The Reverse Implied Odds Trap \u2014 Why Your Junk Hands Cost More Than You Think", "summary": "Most poker players understand implied odds \u2014 the potential to win a big pot when you hit your draw. But there\u2019s a darker mirror: reverse implied odds (RIO). This is the amount of money you\u2019ll lose after you flop a \u201cgood\u201d but second-best hand. Every junk hand you play has massive reverse implied odds that almost always outweigh any positive implied odds. A suited connector like 8\u26607\u26606 has positive implied odds \u2014 when you hit a straight or flush, you get paid. But Q\u26623\u26605 has negative implied odds: when you flop a queen, you\u2019ll lose money to AQ, KQ, QJ, QT, and Q9. You flopped \u201csomething,\u201d but that something costs you chips on every subsequent street.\n\nScenario: You\u2019re in MP with Q\u26623\u26605 and call a limp. Flop Q\u26638\u26608\u26602 \u2014 you flopped top pair, bad kicker. Villain bets 3BB into 6BB. You call. Turn 4\u26605. Villain bets 8BB into 12BB. Now you\u2019re trapped \u2014 you\u2019ve invested 4BB and see a pot of 20BB. You call. River K\u26603. Villain bets 18BB into 28BB. You fold, having lost 12BB on a hand you \u201chit.\u201d No bluff, no cooler \u2014 just normal reverse implied odds. You never even reached showdown, yet the cost was 6x your initial investment. This is why Q\u26623\u26605 from MP is a losing play even when you flop top pair.\n\nFrank Connection: Your junk showdown win rate of 8% is not bad luck \u2014 it\u2019s textbook reverse implied odds. When your junk reaches showdown, it\u2019s almost always second-best. Your 1,046 MP+Junk+3Weak hands are the perfect RIO trap: you enter OOP with a hand that can only flop dominated pairs. Your 986 EP+Junk+3Weak hands are the same story from early position \u2014 even worse RIO because more players behind you can hold dominating cards. The solution is No desire: the desire that whispers \u201cbut I flopped top pair\u201d is the same desire that costs you 12BB instead of your initial 1BB. Run your quantum scan: who could have me dominated? What better kickers are in their range? Channel Minglan \u2014 fold, survive, wait for a spot where implied odds work for you, not against you. Attack like a leopard: strike only when your hand\u2019s true value (accounting for RIO) gives you the advantage.", "cat": "Postflop"}, {"day": 56, "date": "Jul 23", "category": "Preflop", "title": "The Five-Card Preflop Filter \u2014 Five Questions to Kill Junk Before You Act", "summary": "Most preflop mistakes happen in the 3-second gap between seeing your cards and clicking a button. In that gap, desire floods in: \u201cThese cards look decent,\u201d \u201cI\u2019m due for a win,\u201d \u201cJust one more hand.\u201d The Five-Card Preflop Filter is a forced mechanical checklist that bypasses your emotional brain entirely \u2014 five questions you run through before every action. If any gate says no, you fold. No exceptions.\n\nThe five gates: (1) Position \u2014 Where am I sitting? EP = play 10% of hands, MP = 15%, LP = 25%, blinds = ultra-tight vs raises. (2) Raise ahead? \u2014 Did someone raise before me? If yes, tighten your range by half. Did someone limp? Consider isolating. (3) Nuts potential \u2014 Can this hand make the absolute nuts on any board? Suited aces and suited connectors can. Junk offsuit cannot. (4) In position? \u2014 Will I act last postflop? If not, fold every marginal hand. (5) Exit planned? \u2014 Do I know exactly when I\u2019m folding? If you can\u2019t answer \u201con the flop if I miss,\u201d don\u2019t enter. Your 57% JUNK% proves more than half your hands enter without any gate passing \u2014 this filter is your mechanical escape from that.\n\nScenario: You\u2019re in the Hijack (one seat off the cutoff) with Qd9d. Before clicking, run the filter. (1) Position: HJ is middle-late, a playable range of ~18%. Q9s fits. Pass. (2) Raise ahead? Folds to you, no raise. Pass. (3) Nuts potential: Q9s can flop a straight (JT8, T87) or a flush. Decent, not great. Debatable. (4) In position? The cutoff and button are behind you. You are NOT last to act postflop. Fail. Marginal hand + OOP = fold. Now run the same hand from the Button with Qs9s. (1) LP. Pass. (2) First in. Pass. (3) Same hand quality. Pass. (4) IN position, last to act. Pass. (5) Exit plan: fold to flop c-bet if I miss top pair+. Pass. Raise to 2.5BB. Same exact hand, different position, completely different decision. The filter caught the difference your desire didn\u2019t see.\n\nFrank Connection: Your data proves this filter would save more chips than any postflop adjustment. Your 1,046 MP+Junk+3Weak hands fail Gate 1 (MP is not profit territory for junk) and Gate 3 (junk offsuit can\u2019t make the nuts). Your 986 EP+Junk+3Weak hands fail Gates 1, 3, 4, and 5 simultaneously. This filter is the mechanical implementation of No desire \u2014 the desire that whispers \u201cI can play this from anywhere\u201d is exactly what the filter overrides. It\u2019s Minglan in checklist form: patience, observation, survival before action. Attack like a leopard only when all five gates give you green lights \u2014 that\u2019s when you know the setup is right and you strike with confidence. Homework: Write \u201cP-R-A-N-E\u201d on a sticky note (Position, Raise ahead?, nuts potential, IN position, Exit plan) and put it on your monitor. Run it on every hand for one session. Your JUNK% will drop 10 points in a single sitting.", "cat": "Preflop"}, {"day": 57, "date": "Jul 24", "category": "Bankroll", "title": "The Opportunity Cost of Every Junk Hand \u2014 Why Each Entry Robs Your Premium Future", "summary": "In tournament poker, chips are a non-renewable resource. Unlike cash games where you can rebuy, a tournament gives you one stack and one shot. Every chip you invest into a losing hand is a chip you cannot use on the next level when you finally pick up QQ. This is opportunity cost \u2014 the invisible leak that turns a \u201ccheap\u201d 2BB junk call into a tournament-ending mistake that manifests three levels later. The hand you played five orbits ago and the hand that busts you are linked by a chain of chips you\u2019ll never see. Your 57% JUNK% means more than half your entries are feeding this chain.\n\nConcrete scenario: Level 3, 50BB stack. You\u2019re in the Hijack with J\u26657\u2665. It folds to you. You think \u201csuited, not terrible, let\u2019s see a flop\u201d and raise to 2.5BB. Flop: Q\u26609\u26602\u2663. You c-bet 3BB, get called. Turn: 4\u2660. You check-fold. Total loss: 5.5BB. No big deal, right? Now it\u2019s Level 7, blinds 150/300. You\u2019re on 42BB instead of 50BB. The CO raises to 2.5BB, you look down at Q\u2665Q\u2666 on the Button \u2014 a 65% win-rate spot. You 3-bet to 8BB. The CO 4-bet jams for 45BB. With your 42BB, folding is painful \u2014 you\u2019ve already invested 8BB. Calling puts your tournament life on a coin flip against AK. With 50BB, this is a trivial call \u2014 you have the overlay and can absorb the loss. With 42BB, it\u2019s a high-variance shove you\u2019d rather avoid. The J\u26657\u2665 from Level 3 turned a dream spot into a nightmare decision. The 5.5BB you bled wasn\u2019t \u201ccheap.\u201d It cost you the ability to play your premium hand correctly.\n\nFrank Connection: Your data reveals this pattern in numbers. 1,046 MP+Junk+3Weak hands bleeding ~5BB each. 986 EP+Junk+3Weak hands doing the same. That\u2019s 2,000+ tournament entries where you voluntarily burned chips that belonged to the TT+ you\u2019d see later. Your high pocket pair volume should be 8% of hands \u2014 you\u2019re at 2%. The tragedy isn\u2019t just that you play junk. It\u2019s that when you FINALLY get the premium hands your 65% win rate depends on, you\u2019re already short-stacked from the junk you bled earlier, and the hand becomes harder to play correctly. This is No desire in its truest form: the desire for action right now steals certainty from the future. Minglan saves every resource because she knows survival depends on being ready when the real opportunity arrives. Attack like a leopard means folding junk hands is how you preserve the chips for the pounce that matters. Every junk fold is you choosing your future premium hand over your present impulse.", "cat": "Sessions"}, {"day": 58, "date": "Jul 25", "category": "Positional", "title": "The Cutoff's Asymmetric Advantage \u2014 Why Your Most Profitable Unraised Pot Comes From CO", "summary": "The Cutoff (CO) is the most misunderstood position in poker. It's the first seat where the math structurally flips from survival to profit \u2014 your profitable opening range jumps from 12-15% (MP) to 25-35% (CO) not because your cards improve, but because only three players act behind you and the Button acts as a 3-bet deterrent for the blinds. From MP, J9s is a money-losing hand (your 1,046 MP+Junk+3Weak hands prove it). From CO, J9s becomes a profitable isolation raise against a loose limper \u2014 you have position, your opponent\u2019s range is capped (he limped, no premiums), and every continuation bet forces him to fold too often. The fix for your JUNK% isn't just folding more from MP \u2014 it's recognizing that the Cutoff is the reward for patience. Your LP+Junk+3Weak data already proves the concept works: Raise averages +7,794 per hand. Let position do the work, not desire.", "cat": "Preflop"}, {"day": 59, "date": "Jul 26", "category": "Math", "title": "The Equity Realization Discount \u2014 Why Junk OOP Is Worse Than the Calculator Shows", "summary": "The equity calculator lies to you, especially out of position. Your 30% raw equity with J5o from the Big Blind becomes roughly 10-14% realized equity after postflop betting \u2014 you fold before showdown most of the time. Concrete scenario: calling T7o from MP against three limpers at 4.5:1 pot odds seems like a bargain, but your own 13,000-hand data proves you lose roughly 1.2BB per hand because you only profit on the ~4% of flops where you hit two pair or better. This is the math behind your EP+Junk+3Weak (986 hands) and MP+Junk+3Weak (1,046 hands) leaks: you're playing fantasy odds, not realized equity. The preflop quantum scan needs one more filter: \"After position and playability, is my realized equity above 15%?\" No desire means no fantasies about the 4% miracle flop.", "cat": "Math"}, {"day": 60, "date": "Jul 27", "category": "Tournament", "title": "The Target Selector \u2014 Why Every Table Has One Player Funding Your Deep Run", "summary": "The single biggest edge in tournament poker isn't your hand selection, your bet sizing, or even your ICM knowledge. It's who you choose to play against. Most tournament players make the critical mistake of playing their cards instead of playing the player. At any given table, roughly 1-2 players are actively giving away chips \u2014 the winning strategy is to identify them in under an orbit, then exclusively profit from them while folding everything against the rest.\n\nHere's the concrete system. In your first 10 hands at a new table, don't play \u2014 watch. You're looking for three player types. The Station: calls preflop raises with any two cards, rarely folds to c-bets, chases draws without odds. The Folder: folds to any aggression preflop, check-folds 70%+ of flops. The Limper: open-limps from any position, sets a tiny price of entry with weak ranges. These three players are your targets. Against The Station, value bet relentlessly \u2014 TPTK is the nuts, bet 70-80% pot on every street. Against The Folder, c-bet 100% of flops when heads-up \u2014 they'll fold 8 out of 10 times. Against The Limper, isolate from late position with any playable hand and punish their passivity. Against everyone else \u2014 fold or play tight. You're not playing 8-handed. You're playing 1-2 handed, and the rest are just there to make up the blinds.\n\nHere's how this attacks your specific leaks, Frank. Your 57% JUNK% means you're entering pots against everyone \u2014 your junk hands get crushed by the reg's real hands, and you win the occasional pot against the fish but not enough to offset the losses. The Target Selector flips this: against the 1-2 weak players, raise wider (even junk becomes playable with position vs a limper). Against the 6-7 non-targets, fold everything below K9s/A9o \u2014 this single filter would cut your JUNK% in half overnight. Attack like a leopard means you don't attack the herd \u2014 you single out the weakest gazelle and strike when it wanders. The quantum scan you already know \u2014 assign fear/greed attributes: high greed + high fear = The Folder, low fear + high greed = The Station, low fear + low greed = a reg you avoid. Your No desire practice \u2014 you don't need to be involved in every hand. You can fold 7 of 8 orbits and win the tournament in the one orbit where the target limps in. The desire to play is what keeps your JUNK% at 57%. The target selector gives you permission to fold more and profit more.", "cat": "Live Play"}, {"day": 61, "date": "Jul 28", "category": "Turn/River", "title": "The Turn Free Card \u2014 Why Checking Back on the Turn Fills Your River Value", "summary": "The Turn Free Card is a deliberate deception play where you check back the turn with a strong hand specifically to extract maximum value on the river. The common instinct is to barrel every street \u2014 'bet for value, bet for protection, bet because I have a hand.' But on dry, disconnected boards where no draws complete, the second barrel often folds out every hand you want to keep. When you check back the turn, you cap your perceived range in opponent's eyes: they read you as weak, as someone who gave up. On the river, when you bet, that bet looks like a bluff \u2014 and opponents hero-call with hands they would have folded to a turn bet.\n\nConcrete scenario: You open A\u2665Q\u2660 from the CO, BB calls. Flop comes Q\u26667\u26632\u2660 rainbow \u2014 you hit top pair with top kicker on a bone-dry board. You c-bet 1/3 pot, BB calls. Turn is the 4\u2663 \u2014 a complete brick. Instead of automatically firing the second barrel (the play most players make from habit), you check back. River is 9\u2665. BB checks again. Now your perceived range is capped at one pair with no draw \u2014 you look like ATs that gave up, KJs that whiffed, or AQ that got scared. You bet 2/3 pot. BB calls with KQ, Q9, 77, even A7 \u2014 all hands they would have folded to a turn bet. Your check-back turned $25 of value into $50+ by letting the river do what the turn couldn't.\n\nHow this connects to Frank: This is 'Attack like a leopard' in its purest form \u2014 patience, silence, striking when the moment is right and out of your opponent's expectations. 'No desire' means releasing the need to extract value on every single street; sometimes observing and letting the pot grow passively is stronger than forcing it. Minglan patience \u2014 waiting for the river where your information advantage is greatest (you've seen their turn check, they've read your perceived weakness). And the deeper lesson: the turn free card builds the mental habit of restraint, the exact discipline that keeps you from playing junk preflop. If you can learn to check back a top-pair-top-kicker on the turn to let the river play out, you can learn to fold 7\u26603\u2665 before the flop.", "cat": "Postflop"}, {"day": 62, "date": "Jul 30", "category": "Live Reads", "title": "The Frequency-Based Tell \u2014 Opponent Timing Patterns as Your Sharpest Live Read", "summary": "Most low-stakes players have predictable timing patterns: they snap-call with draws, tank-fold with marginal holdings, and insta-bet with monsters because they can't wait to win. This isn't about catching a single fast call \u2014 it's about building a frequency database per opponent over the session.\n\nScenario: A tight player raises from MP, you call A\u2660Q\u2660 on the button. Flop Q\u26667\u26632\u2660 \u2014 he snap-bets 60%. This is unusual for him; he normally pauses 3-4 seconds. The instant action screams top pair or better. You call. Turn 4\u2665. He snap-shoves. Against a tight player on a dry board, this line is almost always a set or AA. You fold; he shows 77. The instant timing betrayed his monster.\n\nOpposite direction: Same opponent opens, you call K\u2660J\u2660 on the button. Flop K\u26668\u26633\u2665. He checks, you bet 50%, he tanks 8 seconds then calls. Turn 2\u2660, he checks again, you bet 70%, he tanks 10 seconds, counts chips, folds. Slow decisions = marginal holdings. Your frequency database told you he's uncomfortable.\n\nThis connects directly to Frank's quantum scan framework. Opponent timing is one of your most reliable measurement tools for quantizing fear and greed. A snap-bettor shows high greed (wants the pot now) with a strong hand. A prolonged tank shows high fear with a marginal holding.\n\nAttack like a leopard: observe timing patterns for 1-2 orbits, build profiles, then strike precisely. Against snap-folders, increase c-bet frequency. Against snap-bettors, fold your marginal hands. Minglan would sit, watch, note every 2-second hesitation, and use that data 10 hands later when the real pot is on the line. The recite before each action: \"Have I built a timing profile for this opponent? What does their speed tell me about fear and greed?\"", "cat": "Live Play"}, {"day": 63, "date": "Jul 31", "category": "Mental Game", "title": "The Escape Plan \u2014 Pre-Program Your Response to the Four Danger Triggers", "summary": "Most players try to manage tilt in the moment: breathe, count to ten, remind yourself it's just one hand. Research says this almost never works \u2014 once the trigger fires, your prefrontal cortex goes offline and your animal brain is driving (Frank calls this survival mode). What actually works is the opposite: deciding the response BEFORE the trigger ever fires. Psychologist Peter Gollwitzer's implementation-intention studies show that pre-written \"if-then\" plans double or triple follow-through rates compared to willpower alone. In poker terms: a small card, written tonight, that says exactly what you will do when pain, fear, greed, or desire shows up. When the noise hits, the card decides \u2014 not the emotion.\n\nScenario: you call the river with top pair, villain turns over air, and you drag a 40-big-blind pot you had no business winning. That surge of power is one of your four danger triggers (The Noise phase of your reset: pain, fear, greed, desire). The illusion is documented in your own principles: catching a bluff creates a feeling of overpowering \u2014 but players mix their plays, and next time you run into real cards. Your escape-plan line for this trigger: \"IF I catch a bluff, THEN I play two orbits of premium-only (TT+, AQ+) and zero hero calls.\" Same for the victim feeling: \"IF I lose as a 70% favorite on the river, THEN I stand up for 60 seconds, re-run the quantum scan, and observe the next three hands without entering a pot.\" Write the line, then never negotiate with it.\n\nThe four triggers map directly to your leaks. Pain (lost a pot, bad beat) sends you hunting revenge junk \u2014 this is how JUNK% spikes to 57%. Fear (downswing, big-stack pressure) makes you play scared: folding premiums and calling too much with marginal hands. Greed (running hot, \"already took some?\") loosens your ranges orbit by orbit. Desire (I want this tournament, I want this pot) forces medium hands that the matrix says to fold. Each one needs its own written if-then response. This is the No desire principle operationalized: you cannot control the feeling, but you can control the pre-committed action. No connection, no action \u2014 applied to the emotional layer instead of the odds layer.\n\nYour JUNK% hands are almost never played from a calm, observing state. They are the output of a triggered state \u2014 a lost coin flip, a caught bluff, a blind steal that got called. The escape plan is the missing link between Phase 3 of your reset animation (recognizing The Noise) and the actual decision. Minglan never out-reacted her opponents; she out-prepared them, which is why patience and wit beat force. The leopard doesn't improvise attacks from emotion either \u2014 its strikes are planned, grouped, and patient. Tonight, write the card: four triggers, four if-then responses, on paper or in Notes. Bring it to the table. When the noise arrives, you won't need to think \u2014 and when a human is thinking, god is laughing.", "cat": "Psychology"}];

var fG=document.getElementById("filterGroup"),sI=document.getElementById("searchInput"),tL=document.getElementById("tipList"),cI=document.getElementById("contentInner"),eS=document.getElementById("emptyState"),tC=document.getElementById("tipCount"),sB=document.getElementById("sidebar"),oL=document.getElementById("overlay"),mT=document.getElementById("mobileToggle");

function getTips(){var q=n(sI.value);return TIPS.filter(function(t){return(activeFilter==="ALL"||t.cat.toUpperCase()===activeFilter)&&(!q||n(t.title).indexOf(q)!==-1||n(t.summary).indexOf(q)!==-1)})}

function rContent(t){if(!t)return;var m=CM[t.cat]||CM.Preflop;var banner=t.day===TD?'<div class="today-banner">\u2605 TODAY TIP</div>':"";cI.innerHTML=banner+'<article class="tip-header"><span class="tip-cat-badge" style="color:'+m[0]+";background:"+m[1]+";border:1px solid "+m[0]+'30;">'+t.cat+'</span><div class="tip-date-line">'+t.date+'</div><h2 class="tip-title">'+t.title+'</h2></article><div class="gold-sep">\u25c6 \u25c6 \u25c6</div><div class="tip-summary">'+fmt(t.summary)+"</div>";eS.style.display="none";cI.style.display="block";cI.style.animation="none";void cI.offsetHeight;cI.style.animation=""}
function selectTip(d){if(activeId===d){activeId=null;eS.style.display="flex";cI.style.display="none";rList();return}activeId=d;rContent(TIPS.find(function(t){return t.day===d}));rList();if(window.innerWidth<=900)closeS()}
