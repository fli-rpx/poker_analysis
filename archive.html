<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Strategy Tips — Poker Analysis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .archive-header {
      text-align: center;
      padding: 2.5rem 0 1rem;
    }
    .archive-header h1 {
      font-size: 1.75rem;
      color: var(--gold);
      margin-bottom: 0.25rem;
    }
    .archive-header .subtitle {
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-bottom: 0;
    }
    .tips-container {
      padding-bottom: 1rem;
    }
    .tip-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .tip-card .tip-date {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .tip-card .tip-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .tip-card .tip-category {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .tip-card .tip-content {
      color: var(--text-dim);
      line-height: 1.8;
    }
    .tip-card .tip-content p {
      margin-bottom: 1rem;
    }
    .tip-card .tip-content p:last-child {
      margin-bottom: 0;
    }
    .back-home {
      text-align: center;
      padding: 1.5rem 0 2.5rem;
    }
    .back-home a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .back-home a:hover {
      color: var(--gold);
    }
    .fallback-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
    }
    .fallback-msg a {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <div class="nav-brand"><a href="index.html">♠ Poker Analysis</a></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="philosophy.html">Philosophy</a></li>
        <li><a href="archive.html">All Tips</a></li>
        <li><a href="analysis.html">Hand History Analysis</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="archive-header">
      <h1>All Strategy Tips</h1>
      <p class="subtitle" id="tip-count">Loading tips…</p>
    </div>

    <div class="tips-container" id="tips-container">
      <div class="loading" id="loading">Fetching strategy tips…</div>
      <noscript>
        <div class="fallback-msg">
          <p>JavaScript is required to load the tips dynamically.</p>
          <p><a href="index.html">← Back to Home</a></p>
        </div>
      </noscript>
    </div>

    <div class="back-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Generated by Hermes Agent · Poker Companion</p>
    </div>
  </footer>

  <script>
    (async function() {
      const container = document.getElementById('tips-container');
      const countEl = document.getElementById('tip-count');

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function categoryStyle(category) {
        const map = {
          'postflop':             'color: #4A90D9; background-color: rgba(74,144,217,0.12);',
          'math':                 'color: #9B59B6; background-color: rgba(155,89,182,0.12);',
          'preflop':              'color: #27AE60; background-color: rgba(39,174,96,0.12);',
          'mental game':          'color: #E67E22; background-color: rgba(230,126,34,0.12);',
          'live reads':           'color: #1ABC9C; background-color: rgba(26,188,156,0.12);',
          'bankroll/session discipline': 'color: #E74C3C; background-color: rgba(231,76,60,0.12);',
          'positional/defense':   'color: #3498DB; background-color: rgba(52,152,219,0.12);',
          'positional':           'color: #3498DB; background-color: rgba(52,152,219,0.12);',
          'hand reading/bluffing':'color: #F39C12; background-color: rgba(243,156,18,0.12);',
          'hand reading':         'color: #F39C12; background-color: rgba(243,156,18,0.12);',
          'hand reading/strategy':'color: #F39C12; background-color: rgba(243,156,18,0.12);',
          'mental preparation':   'color: #E67E22; background-color: rgba(230,126,34,0.12);',
          'postflop/value':       'color: #4A90D9; background-color: rgba(74,144,217,0.12);',
          'tournament-specific':  'color: #E74C3C; background-color: rgba(231,76,60,0.12);',
          'preflop/3bet':         'color: #27AE60; background-color: rgba(39,174,96,0.12);',
          'live reads/opponent exploitation': 'color: #1ABC9C; background-color: rgba(26,188,156,0.12);',
          'table dynamics/opponent exploitation': 'color: #1ABC9C; background-color: rgba(26,188,156,0.12);',
          'postflop/math':        'color: #9B59B6; background-color: rgba(155,89,182,0.12);',
          'math/defense':         'color: #9B59B6; background-color: rgba(155,89,182,0.12);',
          'math/strategy':        'color: #9B59B6; background-color: rgba(155,89,182,0.12);',
          'preflop/multiway':     'color: #27AE60; background-color: rgba(39,174,96,0.12);',
          'turn/river specific strategy': 'color: #4A90D9; background-color: rgba(74,144,217,0.12);',
          'positional play':      'color: #3498DB; background-color: rgba(52,152,219,0.12);',
          'postflop/defense':     'color: #4A90D9; background-color: rgba(74,144,217,0.12);',
        };
        return map[category] || 'color: var(--blue); background-color: rgba(74,144,217,0.1);';
      }

      try {
        const response = await fetch('data/tips.json');
        if (!response.ok) throw new Error('Failed to load tips');
        const data = await response.json();
        const tips = data.tips || [];

        if (tips.length === 0) {
          container.innerHTML = '<div class="fallback-msg">No tips found.</div>';
          countEl.textContent = '0 tips';
          return;
        }

        // Sort newest first
        tips.sort((a, b) => b.date.localeCompare(a.date));

        countEl.textContent = tips.length + ' tips';

        const html = tips.map((tip, index) => {
          const dateObj = new Date(tip.date + 'T00:00:00');
          const dateStr = dateObj.toLocaleDateString('en-US', {
            month: 'long', day: 'numeric', year: 'numeric'
          });
          const paragraphs = tip.content
            .split('\n')
            .map(p => p.trim())
            .filter(p => p.length > 0)
            .map(p => `<p>${escapeHtml(p)}</p>`)
            .join('');

          const separator = index < tips.length - 1
            ? '<span class="gold-separator">───</span>'
            : '';

          return `
            <div class="tip-card">
              <div class="tip-date">${escapeHtml(dateStr)}</div>
              <div class="tip-title">${escapeHtml(tip.title)}</div>
              <div class="tip-category" style="${categoryStyle(tip.category)}">${escapeHtml(tip.category)}</div>
              <div class="tip-content">${paragraphs}</div>
            </div>
            ${separator}
          `;
        }).join('');

        container.innerHTML = html;
      } catch (err) {
        console.warn('Could not load tips:', err);
        container.innerHTML = `
          <div class="fallback-msg">
            <p>Unable to load tips. Please check your connection and try again.</p>
            <p><a href="index.html">← Back to Home</a></p>
          </div>
        `;
        countEl.textContent = '—';
      }
    })();
  </script>

</body>
</html>
